<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="glass-card login-card p-4 p-md-5">
            <a class="brand-mark mb-4" href="{{ url_for('login') }}">
                <span class="brand-icon"><i class="bi bi-check2-square"></i></span>
                <span>Task Manager</span>
            </a>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input class="form-control" id="username" name="username" type="text"
                               placeholder="admin" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input class="form-control" id="password" name="password" type="password"
                               placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="btn btn-success btn-lg w-100" type="submit">
                    Sign in <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
            <p class="demo-hint mt-4 mb-0"><i class="bi bi-info-circle me-1"></i> Demo login: admin / 1234</p>
        </section>
    </main>
</body>
</html>
